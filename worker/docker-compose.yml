services:
  essential-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes:
      - essential-worker-data:/data
    networks:
      - essential-worker-network

  caddy:
    image: caddy:2.10-alpine
    env_file: .env
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - essential-worker
    networks:
      - essential-worker-network

volumes:
  essential-worker-data:
  caddy-data:
  caddy-config:

networks:
  essential-worker-network:
